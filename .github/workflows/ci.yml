name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustup show
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Serial on purpose: the suite has a known lease/cooldown lock-order inversion
      # (deferred.md 2026-09-23, re-confirmed 2026-11-08) that deadlocks under parallel
      # execution on some runs. This is also the documented local gate.
      - run: cargo test -- --test-threads=1
