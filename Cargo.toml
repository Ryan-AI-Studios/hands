[package]
name = "hands"
version = "0.1.0"
edition = "2024"
publish = false
description = "Windows-first eyes-and-hands MCP/CLI"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
rmcp = { version = "3.1.2", features = ["server", "macros", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std", "sync"] }
uuid = { version = "1.24.1", features = ["v4"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_System_Ole",
] }
